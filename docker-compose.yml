x-api-common: &api-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-environment
    HOST: 0.0.0.0
    PORT: 3001
    STATIC_DIR: /app/public
    SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
    PROVIDER_KEY_ENCRYPTION_SECRET: ${PROVIDER_KEY_ENCRYPTION_SECRET:-dev-provider-secret-change-me}
    EMAIL_PASSWORD_REGISTRATION_ENABLED: ${EMAIL_PASSWORD_REGISTRATION_ENABLED:-true}
    EMAIL_OTP_ENABLED: ${EMAIL_OTP_ENABLED:-true}
    EMAIL_OTP_CODE_LENGTH: ${EMAIL_OTP_CODE_LENGTH:-6}
    EMAIL_OTP_TTL_SECONDS: ${EMAIL_OTP_TTL_SECONDS:-600}
    EMAIL_OTP_COOLDOWN_SECONDS: ${EMAIL_OTP_COOLDOWN_SECONDS:-60}
    EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
    REDIS_URL: ${REDIS_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-${SMTP_USER:-}}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GPT Image Playground}
    ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    IMAGE_MAX_UPLOAD_BYTES: ${IMAGE_MAX_UPLOAD_BYTES:-67108864}
    IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-67108864}
    TASK_WORKER_CONCURRENCY: ${TASK_WORKER_CONCURRENCY:-2}
    TASK_WORKER_LEASE_SECONDS: ${TASK_WORKER_LEASE_SECONDS:-1800}
    TASK_WORKER_RECOVER_INTERVAL_SECONDS: ${TASK_WORKER_RECOVER_INTERVAL_SECONDS:-60}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-http://localhost:9000}}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-gpt-image-assets}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-}
    PUBLIC_THUMBNAIL_READS: ${PUBLIC_THUMBNAIL_READS:-false}
    PUBLIC_ORIGINAL_READS: ${PUBLIC_ORIGINAL_READS:-false}
    DEFAULT_PROVIDER_NAME: OpenAI
    DEFAULT_PROVIDER: openai
    DEFAULT_PROVIDER_BASE_URL: https://api.openai.com/v1
    DEFAULT_PROVIDER_MODEL: gpt-image-2
    DEFAULT_PROVIDER_API_MODE: images
    DEFAULT_PROVIDER_API_KEY: ${OPENAI_API_KEY:-}
  restart: unless-stopped

services:
  api-prod:
    <<: *api-common
    ports:
      - "28080:3001"
    environment:
      <<: *api-environment
      WEB_ORIGIN: ${PROD_WEB_ORIGIN:-http://localhost:28080,http://127.0.0.1:28080}
      BETTER_AUTH_URL: ${PROD_BETTER_AUTH_URL:-http://localhost:28080}
      DATABASE_URL: ${PROD_DATABASE_URL:?Set PROD_DATABASE_URL in .env for production}
      REDIS_URL: ${PROD_REDIS_URL:-${REDIS_URL:-}}
      SESSION_COOKIE_NAME: ${PROD_SESSION_COOKIE_NAME:-gip_session}
      COOKIE_SECURE: ${PROD_COOKIE_SECURE:-true}
    networks:
      - prod-external

  api-test:
    <<: *api-common
    ports:
      - "28081:3001"
    environment:
      <<: *api-environment
      WEB_ORIGIN: ${TEST_WEB_ORIGIN:-http://localhost:28081,http://127.0.0.1:28081}
      BETTER_AUTH_URL: ${TEST_BETTER_AUTH_URL:-http://localhost:28081}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://gpt_image:gpt_image@postgres:5432/gpt_image}
      REDIS_URL: ${TEST_REDIS_URL:-${REDIS_URL:-}}
      SESSION_COOKIE_NAME: ${TEST_SESSION_COOKIE_NAME:-gip_test_session}
      COOKIE_SECURE: ${TEST_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpt_image
      POSTGRES_USER: gpt_image
      POSTGRES_PASSWORD: gpt_image
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpt_image -d gpt_image"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

networks:
  prod-external:
    name: 1panel-network
    external: true
